<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agent Settings</title>
  <style>
    :root{color-scheme:light;font-family:Inter,Segoe UI,Arial,sans-serif;--blue:#149ee7;--cyan:#2fd3ff;--ink:#101c2e;--line:#d7e5ee}body{margin:0;background:linear-gradient(180deg,#eef7fc 0%,#f7fbfe 46%,#edf4f8 100%);color:var(--ink)}.topbar{position:relative;overflow:hidden;background:radial-gradient(circle at 56% 0%,rgba(47,211,255,.22),transparent 34%),linear-gradient(135deg,#020915 0%,#061427 54%,#0a2742 100%);color:white;border-bottom:4px solid var(--blue)}.topbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 18px,rgba(47,211,255,.72) 18px 26px,transparent 26px 44px);width:190px;left:auto;opacity:.85}.topbar-inner{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:16px 28px 20px;display:grid;grid-template-columns:180px auto minmax(0,1fr);gap:18px;align-items:center}.brand{font-weight:900;font-size:24px;line-height:1}.brand span,.hero-title span{color:var(--cyan)}.hero-title{font-size:28px;font-weight:800;line-height:1.16;text-shadow:0 2px 8px rgba(0,0,0,.36)}.nav{display:flex;gap:18px;flex-wrap:wrap;align-items:center}.nav a{color:rgba(255,255,255,.88);font-size:14px;font-weight:800;text-decoration:none;padding:5px 2px;border-bottom:2px solid rgba(47,211,255,.18);cursor:pointer;transition:color .16s ease,border-color .16s ease,transform .16s ease}.nav a:hover,.nav a:focus-visible{color:white;border-bottom-color:var(--cyan);transform:translateY(-1px);outline:none}
    main{max-width:920px;margin:0 auto;padding:24px 28px 32px}.panel{background:white;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 26px rgba(7,33,54,.06);padding:18px}h1{font-size:24px;margin:0 0 6px}.small{color:#52616b;font-size:12px;line-height:1.45}.form{display:grid;gap:14px;margin-top:18px}label{display:grid;gap:6px;font-size:13px;font-weight:800;color:#52616b}input,select{border:1px solid #c9d3d7;border-radius:6px;padding:10px;font:inherit;background:white}button{border:0;background:#0b83cc;color:white;border-radius:6px;padding:11px 16px;font-weight:800;cursor:pointer;justify-self:start}.status{font-size:13px;color:#0a4771;margin-left:10px}
    @media(max-width:1040px){.topbar-inner{grid-template-columns:1fr}main{padding:16px}}
  </style>
</head>
<body>
<div class="topbar"><div class="topbar-inner"><div class="brand">Agent<span>|</span>Gate</div><nav class="nav"><a href="/">Chat</a><a href="/data">Data</a><a href="/golden">Tests</a><a href="/scenarios">Scenarios</a><a href="/settings">Settings</a><a href="/feedback">Disliked</a></nav><div class="hero-title">Agent <span>Settings</span></div></div></div>
<main>
  <section class="panel">
    <h1>Agent Settings</h1><div class="small">Saved to {{ settings_path }}. New requests use these values immediately.</div>
    <form id="settingsForm" class="form">
      <label>Ollama model <input name="model" value="{{ settings.model }}" placeholder="qwen3.5:9b"></label>
      <label>Ollama URL <input name="ollama_url" value="{{ settings.ollama_url }}"></label>
      <label>Temperature <input name="temperature" type="number" min="0" max="2" step="0.05" value="{{ settings.temperature }}"></label>
      <label>Max generated tokens <input name="num_predict" type="number" min="128" max="8192" step="1" value="{{ settings.num_predict }}"></label>
      <label>Data source <select name="data_source"><option value="local" {% if settings.data_source == "local" %}selected{% endif %}>Local SQLite</option><option value="zoho" {% if settings.data_source != "local" %}selected{% endif %}>Zoho/MCP</option></select></label>
      <label>Max SQL rows returned <input name="max_sql_rows" type="number" min="1" max="40000" value="{{ settings.max_sql_rows }}"></label>
      <label>Language behavior <select name="language_mode"><option value="match_user" {% if settings.language_mode == "match_user" %}selected{% endif %}>Match user language</option><option value="arabic" {% if settings.language_mode == "arabic" %}selected{% endif %}>Prefer Arabic</option><option value="english" {% if settings.language_mode == "english" %}selected{% endif %}>Prefer English</option></select></label>
      <label>Admin password <input name="admin_password" type="password" autocomplete="current-password"></label>
      <div><button type="submit">Save settings</button><span id="status" class="status"></span></div>
    </form>
  </section>
</main>
<script>
document.getElementById('settingsForm').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status');const body=Object.fromEntries(new FormData(e.target).entries());status.textContent='Saving...';try{const res=await fetch('/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json();if(!data.ok)throw new Error(data.error||'Failed');status.textContent='Saved';}catch(err){status.textContent=String(err)}});
</script>
</body>
</html>
